name: Bug report
description: Report reproducible Side Glance behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove prompts, transcripts, secrets, and unredacted provider configuration.
  - type: input
    id: version
    attributes:
      label: Side Glance version
      placeholder: 0.1.0-beta.9
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, shell, tmux, provider CLI, and sanitized doctor output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal exact steps, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery behavior
      description: What reset, session end, or restart did after the problem.
